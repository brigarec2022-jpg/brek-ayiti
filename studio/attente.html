<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>RTV BREK · Écran d’attente</title>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000 url('/studio/v2/attente.jpg') center/cover;font-family:Arial,Helvetica,sans-serif;color:#fff}
.b{position:absolute;left:0;right:0;bottom:70px;text-align:center}
.t{font:italic 800 40px Arial;color:#f5d58a;text-shadow:0 3px 12px #000;min-height:46px}
.cd{display:inline-block;margin-top:10px;font:900 96px/1 Arial;letter-spacing:4px;text-shadow:0 4px 18px #000;background:#000a;border:2px solid #d4af37;border-radius:16px;padding:10px 40px}
.cd:empty{display:none}
</style></head><body>
<div class="b"><div class="t" id="t"></div><div class="cd" id="cd"></div></div>
<script>
const P=new URLSearchParams(location.search);
if(P.get('titre'))document.getElementById('t').textContent=P.get('titre');
const m=+(P.get('minutes')||0);if(m>0){const end=Date.now()+m*60000;const cd=document.getElementById('cd');(function f(){const s=Math.max(0,Math.round((end-Date.now())/1000));cd.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s>0)setTimeout(f,500);else cd.textContent='EN DIRECT'})()}
</script></body></html>
