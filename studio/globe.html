<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>RTV BREK · Globe animé</title>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#05060a}
body.transparent{background:transparent}
canvas{position:absolute;inset:0}
.t{position:absolute;right:150px;top:50%;transform:translateY(-50%);text-align:right;font-family:Arial,Helvetica,sans-serif;color:#fff;opacity:0}
.t img{width:150px;height:150px;border-radius:50%;border:4px solid #d4af37;box-shadow:0 0 40px #d4af3766}
.t b{display:block;font:900 128px/1 Arial;letter-spacing:4px;margin-top:20px;text-shadow:0 6px 30px #000}
.t .s{display:inline-block;margin-top:18px;background:#c4001c;font:900 40px Arial;letter-spacing:8px;padding:10px 26px}
.t .d{display:block;margin-top:22px;font:700 34px Arial;color:#f5d58a}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="t" id="t"><img src="/membre/logo-brek-carre.png" alt=""><b>RTV BREK</b><span class="s" id="s">BREK INFO</span><span class="d" id="d">Haïti et diaspora</span></div>
<script src="/studio/vendor/d3.min.js"></script>
<script src="/studio/vendor/topojson-client.min.js"></script>
<script>
const P=new URLSearchParams(location.search);
if(P.get('fond')==='0')document.body.classList.add('transparent');
const MODE=P.get('mode')||'intro';             // intro | boucle
if(P.get('titre'))document.getElementById('s').textContent=P.get('titre');
if(P.get('sous'))document.getElementById('d').textContent=P.get('sous');
const W=1920,H=1080,ctx=document.getElementById('c').getContext('2d');
const HT=[-72.4,19.0];
const CITIES=[[-80.19,25.76,'Miami'],[-73.94,40.67,'New York'],[-73.57,45.50,'Montréal'],[2.35,48.86,'Paris'],[-69.93,18.49,'Santo Domingo'],[-70.65,-33.45,'Santiago'],[-46.63,-23.55,'São Paulo'],[-71.06,42.36,'Boston'],[-61.0,14.6,'Fort-de-France']];
const stars=Array.from({length:260},(_,i)=>{const r=Math.sin(i*99.13)*43758.5453;return [((r-Math.floor(r))*W),((Math.sin(i*12.9)*9999%1+1)%1)*H,((i*7)%5)/5*1.4+.3]});
let land,haiti,ready=false;
fetch('/studio/vendor/countries-50m.json').then(r=>r.json()).then(w=>{land=topojson.feature(w,w.objects.land);haiti=topojson.feature(w,w.objects.countries).features.find(f=>f.id==='332');ready=true;if(!P.has('rec'))requestAnimationFrame(loop)});
const proj=d3.geoOrthographic().clipAngle(90).precision(.3);
const path=d3.geoPath(proj,ctx);const grat=d3.geoGraticule10();
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
function draw(t){ // t en secondes
  ctx.clearRect(0,0,W,H);
  if(!document.body.classList.contains('transparent')){const g=ctx.createRadialGradient(W*.42,H*.5,100,W*.42,H*.5,1200);g.addColorStop(0,'#141a2e');g.addColorStop(1,'#030407');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(const [x,y,s] of stars){ctx.globalAlpha=.35+.35*Math.sin(t*2+x);ctx.fillStyle='#fff';ctx.fillRect(x,y,s,s)}ctx.globalAlpha=1}
  let lam,phi=-15,R=400,cx=W/2,cy=H/2;
  if(MODE==='intro'){const k=ease(t/6);lam=-(HT[0]+260*(1-k));phi=-(HT[1])*k-8*(1-k);R=330+110*ease((t-.2)/5);cx=W/2-380*ease((t-5)/2.2)}
  else{lam=-(HT[0])-t*12;phi=-12}
  proj.rotate([lam,phi]).scale(R).translate([cx,cy]);
  // halo
  let g=ctx.createRadialGradient(cx,cy,R*.9,cx,cy,R*1.25);g.addColorStop(0,'rgba(212,175,55,.35)');g.addColorStop(1,'rgba(212,175,55,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.25,0,7);ctx.fill();
  // océan
  g=ctx.createRadialGradient(cx-R*.35,cy-R*.35,R*.1,cx,cy,R);g.addColorStop(0,'#1c3f7a');g.addColorStop(.7,'#0b1d3f');g.addColorStop(1,'#050b1a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
  ctx.beginPath();path(grat);ctx.strokeStyle='rgba(245,213,138,.13)';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();path(land);ctx.fillStyle='#6b0f1c';ctx.fill();ctx.strokeStyle='rgba(245,213,138,.55)';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();path(haiti);ctx.fillStyle='#f2c94c';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  // arcs diaspora
  const a0=MODE==='intro'?3.5:0;
  CITIES.forEach((c,i)=>{const st=a0+i*.25;const p=MODE==='intro'?ease((t-st)/1.4):((t*.35+i*.13)%1.6)/1.2;if(p<=0)return;
    const interp=d3.geoInterpolate(HT,[c[0],c[1]]);const pts=[];const n=48,m=Math.min(1,p);for(let j=0;j<=n*m;j++)pts.push(interp(j/n));
    ctx.beginPath();path({type:'LineString',coordinates:pts});ctx.strokeStyle='rgba(255,90,90,.9)';ctx.lineWidth=2.5;ctx.stroke();
    if(p>=1){const q=proj([c[0],c[1]]);const vis=d3.geoDistance([c[0],c[1]],[-proj.rotate()[0],-proj.rotate()[1]])<Math.PI/2;if(q&&vis){ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.arc(q[0],q[1],5,0,7);ctx.fill()}}});
  // pulsation Haïti
  const h=proj(HT);if(h){for(let k=0;k<3;k++){const ph=((t*.8+k/3)%1);ctx.beginPath();ctx.arc(h[0],h[1],8+ph*60,0,7);ctx.strokeStyle=`rgba(242,201,76,${1-ph})`;ctx.lineWidth=3;ctx.stroke()}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(h[0],h[1],6,0,7);ctx.fill();
    if(MODE==='intro'&&t>2.5){ctx.globalAlpha=ease((t-2.5)/1);ctx.font='900 34px Arial';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=12;ctx.fillText('AYITI',h[0]+22,h[1]-16);ctx.shadowBlur=0;ctx.globalAlpha=1}}
  // reflet
  g=ctx.createRadialGradient(cx-R*.45,cy-R*.5,0,cx-R*.45,cy-R*.5,R*.9);g.addColorStop(0,'rgba(255,255,255,.16)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
  const tt=document.getElementById('t');
  if(MODE==='intro'){const k=ease((t-5.6)/1.2);tt.style.opacity=k;tt.style.transform=`translateY(-50%) translateX(${(1-k)*120}px)`}else tt.style.opacity=0;
}
let t0=null;function loop(ts){if(t0===null)t0=ts;let t=(ts-t0)/1000;if(MODE==='intro'&&t>12&&P.get('repeter')!=='0'){t0=ts;t=0}draw(t);requestAnimationFrame(loop)}
window.__render=t=>{draw(t);return ready};window.__ready=()=>ready;
</script></body></html>
