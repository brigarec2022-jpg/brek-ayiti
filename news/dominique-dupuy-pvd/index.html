<link rel="stylesheet" href="/brek-whatsapp-channel.css?v=20261114"></head><body><main><nav><a href="/#news">← Actualités BREK-AYITI</a><button id="language" type="button">Kreyòl</button></nav><header><p class="tag" id="tag"></p><h1 id="title"></h1><p class="byline" id="byline"></p></header><div id="body"></div><video controls playsinline preload="metadata" poster="portrait.jpg" aria-label="Déclaration vidéo fournie à la rédaction"><source src="declaration.mp4" type="video/mp4">Votre navigateur ne permet pas la lecture de cette vidéo.</video><p class="caption" id="caption"></p><footer><h2 id="sources-title"></h2><ul><li><a href="https://tableau.cephaiti.ht/" target="_blank" rel="noopener noreferrer">CEP — Tableau des inscriptions préliminaires</a></li><li><a href="https://cephaiti.ht/notes-communiques/" target="_blank" rel="noopener noreferrer">CEP — Note du 10 novembre 2026 sur les échéances</a></li><li><a href="https://www.juno7.ht/dominique-dupuy-candidature-presidentielle-pvd/" target="_blank" rel="noopener noreferrer">Juno7 — Inscription de Dominique Dupuy sous le PVD</a></li></ul><a href="/#news" id="back"></a></footer></main><script>const content={"fr": [["Présidentielle 2027", "Présidentielle 2027 : Dominique Dupuy s'inscrit dans la course sous la bannière du PVD"], ["", "L'ancienne ministre des Affaires étrangères a enregistré mercredi sa candidature en ligne auprès du Conseil électoral provisoire (CEP). Elle devient l'une des deux seules femmes parmi les vingt-six prétendants recensés à ce stade."], ["", "C'est désormais officiel. Dominique Dupuy a enregistré ce mercredi 11 novembre sa candidature à la présidence sur la plateforme en ligne du CEP, sous la bannière du Pati Vizyon Dayiti (PVD). Elle porte le numéro 35, selon le tableau publié par l'institution électorale et consulté par plusieurs médias, dont Juno7 et le Haitian Times."], ["", "Avec cette inscription, elle rejoint un peloton de plus en plus fourni : vingt-six candidatures à la présidence figuraient en ligne à la date du 11 novembre. Elle n'y est que la deuxième femme, aux côtés de Savannah Savary."], ["Une première étape, pas encore une candidature complète", "L'inscription en ligne ne constitue que la première phase du processus. Les candidats doivent encore déposer auprès du CEP les pièces requises pour compléter leur dossier. Le Conseil électoral a rappelé que la période d'inscription en ligne pour la présidentielle et les législatives prendra fin le dimanche 15 novembre 2026 à minuit."], ["", "Les prochains jours pourraient donc encore modifier le paysage. Selon des informations relayées par certains médias, un autre candidat considéré comme de poids pourrait officialiser son inscription d'ici samedi. Son nom n'a pas été communiqué."], ["Le programme « SEJES » : une annonce encore à confirmer", "Selon le site Planet Press, la candidate miserait sur un programme baptisé « SEJES », articulé autour de cinq priorités : la sécurité, l'éducation, la justice, l'économie et la santé. Ce programme comporterait onze engagements fondamentaux, parmi lesquels le rétablissement de la sécurité sur l'ensemble du territoire, une justice indépendante, une économie productive et un meilleur accès aux soins. Planet Press lui attribue cette formule : « SEJES n'est pas un catalogue de promesses, c'est un contrat avec le peuple haïtien. »"], ["", "Ces éléments n'ont toutefois pas été repris, à ce jour, par d'autres médias. Le Haitian Times relève au contraire que Dominique Dupuy n'a pas présenté de programme détaillé lors de son annonce. BREK-AYITI n'a pas pu confirmer de manière indépendante l'existence du programme SEJES ni la citation rapportée."], ["", "Dans une vidéo diffusée sur les réseaux sociaux, Dominique Dupuy s'adresse par ailleurs directement aux membres d'un groupe baptisé « Group-Transcendance ». La date d'enregistrement de cette vidéo n'est pas précisée."], ["Un parcours rapide sur la scène publique", "Née en 1990, Dominique Dupuy s'est fait connaître comme ambassadrice et déléguée permanente d'Haïti auprès de l'UNESCO à partir de 2021. C'est à ce poste qu'elle a porté l'inscription de la soupe joumou au patrimoine culturel immatériel de l'humanité, une première pour Haïti. Elle a ensuite été vice-présidente du Conseil exécutif de l'organisation."], ["", "En mars 2024, elle avait été désignée pour siéger au Conseil présidentiel de transition, avant de se retirer quelques jours plus tard. Elle avait alors dénoncé des attaques politiques, des menaces de mort et des obstacles liés à son statut de seule femme parmi huit hommes, tandis que des réserves constitutionnelles étaient soulevées sur son âge. Elle a ensuite occupé le poste de ministre des Affaires étrangères et des Cultes de juin à novembre 2024."], ["", "Ces derniers mois, elle avait entretenu le suspense sur ses intentions. En août, lors de son inscription sur la liste électorale au Cap-Haïtien, elle n'avait ni confirmé ni écarté une candidature. En septembre, elle évoquait encore son « Chimen Limyè », sans annoncer de décision."], ["", "Sa candidature suscite déjà de nombreux débats dans l'opinion. Reste désormais à voir si son dossier sera complété dans les délais, et quel programme elle présentera formellement aux électeurs."], ["", "— BREK-AYITI"], ["", "Sources : Conseil électoral provisoire (tableau des inscriptions en ligne), Juno7, Haitian Times, Planet Press, Le Nouvelliste."]], "ht": [["Prezidansyèl 2027", "Dominique Dupuy enskri sou platfòm CEP a anba banyè PVD"], ["Yon enskripsyon preliminè", "Dominique Dupuy fè enskripsyon li sou entènèt pou prezidans lan mèkredi 11 novanm 2026 anba banyè Pati Vizyon Dayiti (PVD), dapre enfòmasyon Juno7 rapòte, pami lòt medya. Demach sa a se yon premye etap nan pwosesis kandidati a."], ["Validasyon an poko fèt", "Tablo Konsèy Elektoral Pwovizwa a te montre 26 enskripsyon pou prezidans lan lè yo te konsilte l 11 novanm. Done sa yo preliminè e yo kapab chanje. CEP a presize li pral pibliye lis ofisyèl kandida yo apre verifikasyon ak validasyon dosye yo."], ["De dat limit diferan", "Nan nòt li bay 10 novanm, CEP a fikse fen enskripsyon sou entènèt pou prezidans ak eleksyon lejislatif yo pou 15 novanm 2026 a minwi. Kandida yo dwe depoze pyès pou dosye yo pi ta 30 novanm 2026."], ["Yon pakou nan diplomasi", "Dominique Dupuy te reprezantan pèmanan Ayiti nan UNESCO epi li te minis Afè Etranjè an 2024. Li antre kounye a nan lis pèsonalite ki kòmanse demach pou kandida nan prezidans lan."], ["Videyo yo voye bay redaksyon an", "Videyo ki anba a akonpaye nouvèl la kòm dokiman. Dapre prezantasyon yo voye bay redaksyon an, Dominique Dupuy pale sou kandidati li ladan l. Nou poko etabli dat anrejistreman an. Nou retire tèks ki te sou imaj la avèk yon rekadraj ; nou konsève dire ak son orijinal la. Difizyon sa a pa vle di BREK sipòte yon kandidati."]]};let lang='fr';function render(){const t=content[lang];document.documentElement.lang=lang;document.getElementById('tag').textContent=t[0][0]+' · NEWS';document.getElementById('title').textContent=t[0][1];document.getElementById('byline').textContent=lang==='fr'?'Par la rédaction de BREK-AYITI — Port-au-Prince, 11 novembre 2026':'Redaksyon BREK-AYITI · Pòtoprens · 11 novanm 2026';document.getElementById('body').replaceChildren(...t.slice(1).flatMap(([h,p],index)=>{const para=document.createElement('p');para.textContent=p;if(index===0&&lang==='fr')para.style.fontWeight='700';if(!h)return [para];const heading=document.createElement('h2');heading.textContent=h;return [heading,para]}));document.getElementById('caption').textContent=lang==='fr'?'Vidéo fournie à la rédaction · Recadrage des textes superposés · Son original conservé.':'Videyo yo voye bay redaksyon an · Tèks sou ekran retire pa rekadraj · Son orijinal konsève.';document.getElementById('sources-title').textContent=lang==='fr'?'Sources':'Sous';document.getElementById('back').textContent=lang==='fr'?'← Toutes les actualités':'← Tout nouvèl yo';document.getElementById('language').textContent=lang==='fr'?'Kreyòl':'Français'}document.getElementById('language').addEventListener('click',()=>{lang=lang==='fr'?'ht':'fr';render()});render();</script><script src="/brek-community-config.js"></script><script defer src="/brek-community.js?v=20261116p"></script><script type="module" src="/brek-search.js?v=20261114-integrated4"></script><script defer src="/brek-whatsapp-channel.js?v=20261114"></script><script src="/brek-direct.js?v=2" defer></script></body></html>
