name: diag-radio
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://brek-ayiti.pages.dev
          echo "== trace"; curl -s $B/cdn-cgi/trace | head -20
          for f in radio/l-internationale.mp3 radio/majestic-fanfare.mp3 radio/flash-info-monique-2026-11-24.mp3 radio/kompa-de-la-patrie-2.mp3; do
            echo "== $f"; curl -s -o /dev/null -D - -H "Range: bytes=1000000-1000099" $B/$f | grep -iE "^HTTP|content-range|content-length|content-type|accept-ranges|content-encoding|cache"
          done
          echo "== head date"; curl -sI $B/radio/disques/radio.webp | grep -iE "^HTTP|^date"
          echo "== page"; curl -s $B/radio/ | grep -o "syncClock\|playbackRate\|kompa-de-la-patrie-[0-9]" | sort | uniq -c
