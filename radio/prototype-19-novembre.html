<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio BREK — Réveil révolutionnaire</title><style>*{box-sizing:border-box}body{margin:0;background:#100909;color:white;font:16px Arial,sans-serif;padding:24px}main{max-width:1100px;margin:auto;background:radial-gradient(ellipse at top right,#680a17,#16090d 65%);border:1px solid #c8a05a;border-radius:20px;padding:28px;box-shadow:0 20px 60px #000}section{display:grid;grid-template-columns:38% 1fr;gap:32px;align-items:center}img{width:100%;display:block;border:2px solid #d3aa62;border-radius:14px}h1{font-size:clamp(32px,6vw,65px);font-style:italic;margin:0}b{background:#b60820;padding:4px 10px}h2{font-size:clamp(25px,5vw,50px);margin:36px 0 10px}small{color:#e5c38e}canvas{width:100%;height:140px;display:block}figure{margin:0}figcaption{padding:15px;background:#a6091b;border-radius:0 0 10px 10px;font-size:22px;font-weight:bold}figcaption small{display:block;font-size:13px;margin-top:5px}audio{width:100%;margin-top:15px}button{background:#b6091e;color:white;border:1px solid #d8b46d;padding:12px 18px;border-radius:8px;cursor:pointer}footer{margin-top:22px;border-top:1px solid #75532f;padding-top:16px;color:#edcfaa;font-size:13px}input{max-width:100%}@media(max-width:650px){body{padding:10px}main{padding:16px}section{grid-template-columns:1fr;gap:18px}figure{max-width:280px;margin:auto}h2{margin-top:20px}}.music-art{min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;border:2px solid #d3aa62;border-radius:14px;background:radial-gradient(ellipse at top,#680a17,#100909 75%);text-align:center;padding:18px}.music-art span{font-weight:bold;letter-spacing:3px}.music-art strong{font-size:clamp(18px,2.8vw,32px)}.record{width:145px;height:145px;border-radius:50%;display:grid;place-items:center;font-size:55px;color:#e5c38e;background:repeating-radial-gradient(circle,#20191b 0 3px,#34282c 4px 5px);border:2px solid #c8a05a}[hidden]{display:none!important}</style><main><section><figure id="moniqueVisual"><img src="monique.png"><figcaption>Monique François<small>Présentatrice virtuelle (IA) · Radio BREK</small></figcaption></figure><figure id="musicVisual" hidden><div class="music-art"><span>RADIO BREK</span><div class="record">♫</div><strong>L’INTERNATIONALE</strong><small>Programmation musicale</small></div></figure><div><h1>Radio <b>BREK</b></h1><p>La Voix de la Révolution Classique</p><h2 id="program">RÉVEIL RÉVOLUTIONNAIRE</h2><small id="status">Prêt</small><canvas id="wave" width="900" height="180"></canvas><audio id="audio" controls preload="auto"></audio><button hidden id="restart">↶ Recommencer depuis 06:00</button></div></section><button hidden id="next">Passer au Flash Info</button><button hidden id="outro">Écouter la clôture</button><footer>Jeudi 19 novembre 2026 · Heure d’Haïti : <strong id="clock">06:00:00</strong></footer></main><script>const tracks=["majestic.mp3","flash-info.mp3","internationale.mp3"];const a=document.getElementById('audio'),cv=document.getElementById('wave'),g=cv.getContext('2d'),st=document.getElementById('status');let ac,an,d,idx=0;const urls=tracks;function load(i,play=false){idx=i;document.getElementById('moniqueVisual').hidden=i===3;document.getElementById('musicVisual').hidden=i!==3;a.src=urls[i===2?0:i===3?2:i];document.getElementById('program').textContent=i===3?'L’INTERNATIONALE':i===1?'FLASH INFO · MONIQUE':'RÉVEIL RÉVOLUTIONNAIRE';st.textContent='PRÊT';if(play){setup();a.play().catch(()=>st.textContent='Appuyez sur Play')}}function setup(){if(!ac){ac=new AudioContext();an=ac.createAnalyser();an.fftSize=256;ac.createMediaElementSource(a).connect(an);an.connect(ac.destination);d=new Uint8Array(an.frequencyBinCount)}ac.resume()}a.addEventListener('play',()=>{setup();st.textContent='EN COURS'});a.addEventListener('pause',()=>{if(!a.ended)st.textContent='PAUSE'});a.addEventListener('ended',()=>{if(idx<3)load(idx+1,true);else st.textContent='ÉMISSION TERMINÉE'});document.getElementById('restart').onclick=()=>load(0,true);document.getElementById('next').onclick=()=>load(1,true);document.getElementById('outro').onclick=()=>load(2,true);function draw(){g.clearRect(0,0,900,180);if(an)an.getByteFrequencyData(d);let grad=g.createLinearGradient(0,0,0,180);grad.addColorStop(0,'#f9d891');grad.addColorStop(.5,'#ee2839');grad.addColorStop(1,'#8c0a26');g.fillStyle=grad;for(let i=0;i<65;i++){let h=(!a.paused&&an)?Math.max(3,d[i]*.65):3;g.fillRect(i*13.8+2,90-h/2,8,h)}let t=Math.floor((idx===3?386.956735:idx===2?317.716735:idx===1?69.24:0)+(a.currentTime||0));document.getElementById('clock').textContent='06:'+String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');requestAnimationFrame(draw)}load(0);draw()</script></html>
